# DigitalOcean App Platform spec for vsite.in
#
# NOT APPLIED. Review before running:
#   doctl apps update <APP_ID> --spec apps/web/.do/app.yaml
#
# In the DO console, Source Directory MUST be set to `apps/web`.
# Without it the build runs at the repo root, finds no package.json,
# and fails.
name: vsite-web
region: blr

services:
  - name: web
    source_dir: apps/web
    github:
      repo: daffodilirenesstudent-dot/vsite.in
      branch: master
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /

# The cron below was declared in vercel.json and netlify.toml. DigitalOcean
# App Platform reads NEITHER file, so on DO it has never fired. It calls the
# existing /api/cron/* route, which authenticates with Bearer CRON_SECRET via
# @/lib/platform/cronAuth.
#
# ⚠ IT IS NOT SCHEDULED. `kind: PRE_DEPLOY` runs a job once per deploy, not on
#   an interval — App Platform has no cron primitive for this. A real schedule
#   needs an external trigger: a DO Function on a timer, or an external cron
#   service POSTing with the bearer header. Tracked in AGENTS.md.
#
# 2026-09-21: the email-queue drain and plan-expiry reminder jobs were removed with the
# email notification layer. Notifications move to WhatsApp; its reminder job
# will need the same external trigger.
#
# CRON_SECRET must be set as an app-level secret. Every route fails CLOSED
# without it, so a missing value stops the job rather than opening it.
jobs:
  - name: cron-cleanup
    kind: PRE_DEPLOY
    source_dir: apps/web
    github:
      repo: daffodilirenesstudent-dot/vsite.in
      branch: master
    run_command: >-
      curl -fsS -X POST -H "authorization: Bearer $CRON_SECRET"
      "$NEXT_PUBLIC_BASE_URL/api/cron/cleanup"
    instance_size_slug: basic-xxs
